name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Scoped to test/ and the utils added since the format sweep began.
      # The rest of lib/ predates it and is not yet dart format clean;
      # widening this is tracked separately so the reformat lands as its
      # own reviewable commit rather than burying real changes.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed test lib/utils

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
